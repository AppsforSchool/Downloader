<!DOCTYPE html>
<!--
  Downloader 基本HTML（データ用リポジトリのindex.htmlのひな形）
  このファイルをデータ用リポジトリのルートにコピーして使う。
  画面・CSS・JSZip は app.js が自動で読み込む。
  ※ このDownloaderリポジトリ自体には info.json が無いため、ここを開くとエラー表示になる（正常）。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダウンローダー</title>
</head>
<body>
<div id="app"></div>

<!-- 必要な場合のみ設定を上書き（通常は不要。GitHub PagesのURLからowner/repoを自動判定する）
<script>
  window.DOWNLOADER_CONFIG = { owner: "appsforschool", repo: "Nyuusi_Gifu", branch: "main" };
</script>
-->
<script src="https://appsforschool.github.io/Downloader/app.js"></script>
</body>
</html>
